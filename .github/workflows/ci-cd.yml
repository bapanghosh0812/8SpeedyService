name: 8SpeedyService CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend & PostgreSQL 16 Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: speedyservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - working-directory: backend
        run: npm ci

      - working-directory: backend
        run: npm run typecheck

      - working-directory: backend
        run: npm run build

      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/speedyservice_test
        run: npm test

  mobile-and-web:
    name: Customer & Partner Apps Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze speedy_core
        working-directory: packages/speedy_core
        run: |
          flutter pub get
          flutter analyze

      - name: Build Customer App (Web + Android APK)
        working-directory: apps/customer
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release --no-wasm-dry-run
          flutter build apk --release

      - name: Build Partner App (Web + Android APK)
        working-directory: apps/partner
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release --no-wasm-dry-run
          flutter build apk --release

      - name: Upload Android Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: 8SpeedyService-Android-APKs
          path: |
            apps/customer/build/app/outputs/flutter-apk/app-release.apk
            apps/partner/build/app/outputs/flutter-apk/app-release.apk

  deploy-verify:
    name: Web Bundle Verification
    runs-on: ubuntu-latest
    needs: [backend, mobile-and-web]

    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f deploy/customer/index.html
          test -f deploy/partner/index.html
          test -f deploy/web/index.html
          test -f deploy/web/customer/index.html
          test -f deploy/web/partner/index.html
