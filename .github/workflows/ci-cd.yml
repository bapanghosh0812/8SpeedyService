name: 8SpeedyService CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  backend:
    name: Backend & PostgreSQL 16 Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: speedyservice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - working-directory: backend
        run: npm ci

      - working-directory: backend
        run: npm run typecheck

      - working-directory: backend
        run: npm run build

      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/speedyservice_test
        run: npm test

  mobile-and-web:
    name: Customer & Partner Apps Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Analyze speedy_core
        working-directory: packages/speedy_core
        run: |
          flutter pub get
          flutter analyze

      - name: Build Customer App (Web + Android APK)
        working-directory: apps/customer
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release --no-wasm-dry-run --dart-define="MASTER_AUTH_PHONES=${{ vars.MASTER_AUTH_PHONES || '+919883290273,+919635297320' }}" --dart-define="MASTER_AUTH_OTP=${{ vars.MASTER_AUTH_OTP || '123456' }}"
          flutter build apk --release --dart-define="MASTER_AUTH_PHONES=${{ vars.MASTER_AUTH_PHONES || '+919883290273,+919635297320' }}" --dart-define="MASTER_AUTH_OTP=${{ vars.MASTER_AUTH_OTP || '123456' }}"

      - name: Build Partner App (Web + Android APK)
        working-directory: apps/partner
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release --no-wasm-dry-run --dart-define="MASTER_AUTH_PHONES=${{ vars.MASTER_AUTH_PHONES || '+919883290273,+919635297320' }}" --dart-define="MASTER_AUTH_OTP=${{ vars.MASTER_AUTH_OTP || '123456' }}"
          flutter build apk --release --dart-define="MASTER_AUTH_PHONES=${{ vars.MASTER_AUTH_PHONES || '+919883290273,+919635297320' }}" --dart-define="MASTER_AUTH_OTP=${{ vars.MASTER_AUTH_OTP || '123456' }}"

      - name: Upload Customer Android APK
        uses: actions/upload-artifact@v4
        with:
          name: 8SpeedyService-Customer-APK
          path: apps/customer/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Partner Android APK
        uses: actions/upload-artifact@v4
        with:
          name: 8SpeedyService-Partner-APK
          path: apps/partner/build/app/outputs/flutter-apk/app-release.apk

  deploy-cd:
    name: Live Web CD & Preview Links
    runs-on: ubuntu-latest
    needs: [backend, mobile-and-web]
    environment:
      name: production-preview
      url: https://bapanghosh0812.github.io/8SpeedyService/

    steps:
      - uses: actions/checkout@v4

      - name: Verify Standalone & Combined Web Bundles
        run: |
          test -f deploy/customer/index.html
          test -f deploy/partner/index.html
          test -f deploy/web/index.html
          test -f deploy/web/customer/index.html
          test -f deploy/web/partner/index.html
          touch deploy/web/.nojekyll

      - name: Deploy Live Web Portal to GitHub Pages Branch (CD)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy/web
          force_orphan: true

      - name: Publish Live Preview URLs to Workflow Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 8SpeedyService — Continuous Deployment (CD) Live Links
          | Application | Live Web URL | Netlify Publish Directory |
          | :--- | :--- | :--- |
          | **Customer App (Standalone)** | [Open Customer App](https://bapanghosh0812.github.io/8SpeedyService/customer/) | `deploy/customer` |
          | **Partner App (Standalone)** | [Open Partner App](https://bapanghosh0812.github.io/8SpeedyService/partner/) | `deploy/partner` |
          | **Unified Portal (Both Apps)** | [Open Unified Portal](https://bapanghosh0812.github.io/8SpeedyService/) | `deploy/web` |
          EOF
